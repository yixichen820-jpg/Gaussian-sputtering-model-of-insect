<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGL 诊断</title>
    <style>
      :root { color-scheme: dark; --bg:#080a0e; --text:#f5f7fa; --muted:#9ca7b5; --green:#7dd3a8; --red:#e27a72; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
      .card { width:min(620px,calc(100% - 32px)); padding:28px; border:1px solid rgba(255,255,255,.13); border-radius:16px; background:rgba(14,18,24,.9); }
      h1 { margin:0 0 16px; font-size:24px; }
      p { color:var(--muted); line-height:1.7; }
      .result { padding:16px; border-radius:12px; background:rgba(255,255,255,.05); font-weight:700; }
      .ok { color:var(--green); }
      .fail { color:var(--red); }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>WebGL 诊断</h1>
      <div class="result" id="result">正在检测...</div>
      <p id="detail"></p>
    </main>
    <script>
      const canvas = document.createElement('canvas');
      const gl2 = canvas.getContext('webgl2');
      const gl = gl2 || canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      const result = document.getElementById('result');
      const detail = document.getElementById('detail');
      if (!gl) {
        result.textContent = 'WebGL 不可用';
        result.className = 'result fail';
        detail.textContent = '你的浏览器当前不能运行 3D 高斯模型。请开启浏览器硬件加速，或更新显卡驱动，再重新打开网站。';
      } else {
        const info = gl.getParameter(gl.RENDERER) || '';
        const version = gl.getParameter(gl.VERSION) || '';
        result.textContent = gl2 ? 'WebGL2 可用' : 'WebGL 可用';
        result.className = 'result ok';
        detail.textContent = `渲染器：${info}；版本：${version}`;
      }
    </script>
  </body>
</html>
