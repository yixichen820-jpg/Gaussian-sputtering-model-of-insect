<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>昆虫模型视频预览</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080a0e;
        --panel: rgba(14, 18, 24, 0.9);
        --line: rgba(255, 255, 255, 0.13);
        --text: #f5f7fa;
        --muted: #9ca7b5;
        --accent: #7dd3a8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      .video-page {
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 100%;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 38%, rgba(61, 82, 96, 0.24), transparent 48%),
          linear-gradient(180deg, #0b0e13, #080a0e);
      }

      .video-card {
        width: min(1040px, 100%);
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      }

      .video-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 4px 4px 14px;
      }

      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
      }

      .video-label {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      video {
        display: block;
        width: 100%;
        max-height: 76vh;
        border-radius: 12px;
        background: #000;
        outline: none;
      }

      .video-footer {
        padding-top: 12px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="video-page">
      <section class="video-card">
        <div class="video-header">
          <h1>昆虫高斯溅射模型预览</h1>
          <span class="video-label">Video Preview</span>
        </div>
        <video src="/previews/model-preview.mp4" controls autoplay muted loop playsinline></video>
        <div class="video-footer">此页面不依赖 WebGL，任何浏览器均可播放。</div>
      </section>
    </main>
  </body>
</html>
