<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模型管理</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23090b0f'/><path d='M8 17l5 5 11-12' fill='none' stroke='%237dd3a8' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <link rel="stylesheet" href="/admin.css" />
    <script type="importmap">
      {
        "imports": {
          "lucide": "/node_modules/lucide/dist/esm/lucide.mjs"
        }
      }
    </script>
  </head>
  <body>
    <div class="admin-shell">
      <header class="admin-header">
        <div class="admin-brand">
          <div class="admin-brand-mark" aria-hidden="true">
            <i data-lucide="folder-cog"></i>
          </div>
          <div>
            <p class="admin-eyebrow">Model Console</p>
            <h1>模型管理</h1>
          </div>
        </div>
        <div class="header-actions">
          <button class="back-link lock-button" id="lock-button" type="button" hidden>
            <i data-lucide="lock"></i>
            <span>锁定编辑</span>
          </button>
          <a class="back-link" href="/">
            <i data-lucide="arrow-left"></i>
            <span>返回展示页</span>
          </a>
        </div>
      </header>

      <main class="admin-main">
        <section class="auth-gate" id="auth-gate">
          <div class="auth-copy">
            <span class="auth-icon" aria-hidden="true">
              <i data-lucide="lock-keyhole"></i>
            </span>
            <div>
              <h2>编辑保护已开启</h2>
              <p>输入管理秘钥后才能上传、修改名称或删除模型。</p>
            </div>
          </div>
          <form class="unlock-form" id="unlock-form">
            <input id="admin-key-input" name="key" type="password" placeholder="输入管理秘钥" autocomplete="off" />
            <button type="submit">
              <i data-lucide="key-round"></i>
              <span>解锁编辑</span>
            </button>
          </form>
        </section>

        <nav class="admin-tabs" id="admin-tabs" aria-label="管理分区">
          <button class="admin-tab" id="tab-rank-btn" type="button" aria-selected="false">阶元管理</button>
          <button class="admin-tab" id="tab-fill-btn" type="button" aria-selected="false">模型填充</button>
          <button class="admin-tab is-active" id="tab-models-btn" type="button" aria-selected="true">模型管理</button>
        </nav>

        <section class="upload-section" id="upload-section" data-tab="models" hidden>
          <form id="upload-form" class="upload-form">
            <input id="file-input" name="file" type="file" accept=".ply,.spz,.splat,.ksplat" multiple hidden />
            <button id="upload-zone" class="upload-zone" type="button">
              <span class="upload-icon" aria-hidden="true">
                <i data-lucide="upload-cloud"></i>
              </span>
              <strong id="upload-title">选择模型文件</strong>
              <span id="upload-subtitle">支持 PLY / SPZ / SPLAT / KSPLAT，可批量上传</span>
            </button>
          </form>
          <div class="upload-tasks" id="upload-tasks" hidden></div>
        </section>

        <section class="summary-band" aria-label="模型统计" data-tab="models">
          <div>
            <span class="summary-label">模型数量</span>
            <strong id="model-count">0</strong>
          </div>
          <div>
            <span class="summary-label">总点数</span>
            <strong id="total-splats">0</strong>
          </div>
          <div>
            <span class="summary-label">占用空间</span>
            <strong id="total-size">0 B</strong>
          </div>
        </section>

        <section class="rank-catalog-section" data-tab="rank">
          <div class="section-heading">
            <div>
              <h2>阶元管理</h2>
              <span id="rank-catalog-hint"></span>
            </div>
            <button class="back-link add-rank-button" id="add-rank-button" type="button">
              <i data-lucide="plus"></i>
              <span>新增阶元</span>
            </button>
          </div>
          <form class="rank-editor" id="rank-editor" hidden>
            <div class="rank-editor-grid">
              <label>
                <span>阶元 key</span>
                <input id="rank-key" type="text" maxlength="40" placeholder="例如：subfamily" />
              </label>
              <label>
                <span>中文名</span>
                <input id="rank-name" type="text" maxlength="40" placeholder="例如：亚科" />
              </label>
              <label>
                <span>拉丁名</span>
                <input id="rank-name-latin" type="text" maxlength="80" placeholder="例如：Subfamilia" />
              </label>
              <label>
                <span>坐标</span>
                <input id="rank-position" type="text" placeholder="例如：20.1" />
              </label>
              <label>
                <span>阶元类型</span>
                <select id="rank-base">
                  <option value="false">特殊阶元</option>
                  <option value="true">基础阶元</option>
                </select>
              </label>
              <input id="rank-parent-id" type="hidden" />
            </div>
            <div class="taxonomy-editor-actions">
              <button class="action-button primary-action" id="rank-save" type="button">
                <i data-lucide="save"></i>
                <span>保存阶元</span>
              </button>
              <button class="action-button" id="rank-cancel" type="button">
                <i data-lucide="x"></i>
                <span>取消</span>
              </button>
            </div>
          </form>
          <div id="rank-tree" class="rank-tree"></div>
          <div id="rank-list" class="rank-list"></div>
        </section>

        <section class="taxonomy-section" data-tab="fill">
          <div class="section-heading">
            <div>
              <h2>模型填充</h2>
              <span id="taxonomy-hint"></span>
            </div>
            <button class="back-link add-taxonomy-button" id="add-taxonomy-button" type="button">
              <i data-lucide="plus"></i>
              <span>新增分类</span>
            </button>
          </div>
          <form class="taxonomy-editor" id="taxonomy-editor" hidden>
            <div class="taxonomy-editor-grid">
              <label>
                <span>分类名称</span>
                <input id="taxonomy-name" type="text" maxlength="50" placeholder="例如：鞘翅目" />
              </label>
              <label>
                <span>坐标</span>
                <input id="taxonomy-code" type="text" maxlength="120" placeholder="例如：QCM:40-001" />
              </label>
              <label>
                <span>层级</span>
                <select id="taxonomy-rank">
                  <option value="">加载中...</option>
                </select>
              </label>
              <label>
                <span>父级分类</span>
                <select id="taxonomy-parent">
                  <option value="">无（顶层）</option>
                </select>
              </label>
              <label>
                <span>排序</span>
                <input id="taxonomy-sort" type="number" min="1" step="1" value="1" />
              </label>
            </div>
            <div class="taxonomy-editor-grid">
              <label>
                <span>拉丁学名</span>
                <input id="taxonomy-name-latin" type="text" maxlength="120" placeholder="例如：Lepidoptera" />
              </label>
              <label>
                <span>状态</span>
                <select id="taxonomy-active">
                  <option value="true">启用</option>
                  <option value="false">停用</option>
                </select>
              </label>
              <label>
                <span>核实状态</span>
                <select id="taxonomy-status">
                  <option value="confirmed">已确认</option>
                  <option value="pending">待确认</option>
                </select>
              </label>
            </div>
            <label class="taxonomy-key-label">
              <span>鉴定特征摘要</span>
              <textarea id="taxonomy-key-text" rows="3" maxlength="500" placeholder="用于快速识别，例如：前翅角质硬化，形成鞘翅。"></textarea>
            </label>
            <label class="taxonomy-key-label">
              <span>分类依据</span>
              <textarea id="taxonomy-basis" rows="3" maxlength="1000" placeholder="例如：形态学、分子系统学依据"></textarea>
            </label>
            <label class="taxonomy-key-label">
              <span>阶元介绍</span>
              <textarea id="taxonomy-intro" rows="4" maxlength="2000" placeholder="该分类的总体介绍"></textarea>
            </label>
            <div class="taxonomy-editor-actions">
              <button class="action-button primary-action" id="taxonomy-save" type="button">
                <i data-lucide="save"></i>
                <span>保存分类</span>
              </button>
              <button class="action-button" id="taxonomy-cancel" type="button">
                <i data-lucide="x"></i>
                <span>取消</span>
              </button>
            </div>
          </form>
          <div id="taxonomy-list" class="taxonomy-list"></div>
        </section>

        <section class="model-list-section" data-tab="models">
          <div class="section-heading">
            <h2>模型列表</h2>
            <span id="list-hint"></span>
          </div>
          <div id="model-list" class="model-list"></div>
          <div id="empty-state" class="empty-state" hidden>
            <i data-lucide="inbox"></i>
            <p>还没有模型，上传一个 PLY 文件开始管理。</p>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <footer class="admin-site-version">
      <a href="/changelog.html">V8.8</a>
      <span>CYC联合创建</span>
    </footer>
    <script type="module" src="/admin.js"></script>
  </body>
</html>
